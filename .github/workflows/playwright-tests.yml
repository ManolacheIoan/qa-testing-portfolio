name: Playwright Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'playwright-practice/**'
      - 'requirements.txt'
      - '.github/workflows/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'playwright-practice/**'
      - 'requirements.txt'
      - '.github/workflows/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pytest pytest-playwright
          playwright install --with-deps chromium

      - name: Run tests
        run: pytest playwright-practice/test_login_pytest.py -v
